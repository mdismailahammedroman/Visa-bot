# local device
name: Visa Bot CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted # Local Windows runner

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Docker login
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t visa-bot .
          docker tag visa-bot ${{ secrets.DOCKER_USERNAME }}/visa-bot:latest

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/visa-bot:latest

      # Deploy locally with Docker Compose
      - name: Deploy locally
        run: |
          docker-compose -f C:/Users/Tomal/actions-runner/_work/visa-bot/docker-compose.yml pull
          docker-compose -f C:/Users/Tomal/actions-runner/_work/visa-bot/docker-compose.yml up -d
